<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>مغامرة د. حمص | حياة إيليت</title>
<meta name="description" content="لعبة تعليمية للأطفال مع د. حمص طبيب الأسنان في عيادة حياة إيليت — تعلّم تحافظ على أسنانك وتحب زيارة طبيب الأسنان." />
<meta property="og:image" content="homos.jpg" />
<meta name="theme-color" content="#0c1424" />
<link rel="icon" href="../icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Cairo:wght@600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
/* Layout: one phone-width column; every level = illustrated scene card on top, answer cards below.
   Palette follows the Hyatt Elite site + logo: deep navy ground, gold accents, warm cream cards. */
:root{
  color-scheme:dark;
  --night:#0c1424; --navy:#17243b; --navy2:#24365a; --navy3:#33497a;
  --gold:#c9a24a; --gold-hi:#f1d590; --gold-lo:#8a6d2c;
  --cream:#fbf6ea; --cream2:#f1e7d0; --ink:#17243b; --muted:#b9c1cf;
  --good:#3fbf8a; --good-lo:#23845c; --bad:#e5625e; --bad-lo:#b13f3c;
  --f-display:"Baloo Bhaijaan 2","Cairo",system-ui,sans-serif;
  --f-body:"Cairo","Baloo Bhaijaan 2",system-ui,sans-serif;
}
html[lang="en"]{--f-display:"Fredoka","Baloo Bhaijaan 2",system-ui,sans-serif;--f-body:"Fredoka","Cairo",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--f-body);color:#fff;overflow-x:hidden;min-height:100dvh;
  background:
    radial-gradient(120% 60% at 50% 0%, #24365a 0%, rgba(36,54,90,0) 70%),
    radial-gradient(circle at 15% 85%, rgba(201,162,74,.12), transparent 40%),
    var(--night);
}
body:before{ /* faint gold sparkle field */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.5px 1.5px at 20% 30%,var(--gold-hi),transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,var(--gold),transparent),radial-gradient(1px 1px at 35% 75%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 50%,var(--gold-hi),transparent);
}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
img{max-width:100%}
.app{
  max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;
  padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:8px;z-index:5}
.top .logo{height:38px;border-radius:8px}
.top .sp{flex:1}
.pill{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--navy);border-radius:999px;padding:4px 12px 4px 10px;font-weight:900;font-size:16px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 var(--gold-lo)}
.pill img{width:20px;height:20px}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--navy2);border:2px solid rgba(201,162,74,.5);font-size:18px;display:grid;place-items:center;font-weight:800;color:var(--gold-hi)}
.progress{display:flex;gap:5px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap;direction:ltr}
html[dir="rtl"] .progress{flex-direction:row-reverse}
.progress i{width:14px;height:17px;border-radius:45% 45% 40% 40% / 35% 35% 60% 60%;background:transparent;border:2px solid var(--navy3);transition:.3s}
.progress i.done{background:var(--gold);border-color:var(--gold)}
.progress i.now{background:#fff;border-color:#fff;box-shadow:0 0 0 3px rgba(241,213,144,.45);transform:scale(1.2)}

/* ---------- screens ---------- */
.screen{display:none;flex:1;flex-direction:column;align-items:center;text-align:center;gap:12px;animation:enter .45s ease}
.screen.on{display:flex}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(34px,9vw,48px);color:var(--gold-hi);text-shadow:0 3px 0 rgba(0,0,0,.35)}
h2{font-size:clamp(21px,5.6vw,26px);color:#fff}
.sub{font-size:18px;color:var(--muted);font-weight:700;margin:0}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(201,162,74,.14);color:var(--gold-hi);border:1.5px solid rgba(201,162,74,.55);border-radius:999px;padding:3px 14px;font-weight:800;font-size:14px;letter-spacing:.02em}

.btn{
  font-family:var(--f-display);font-size:23px;font-weight:800;padding:12px 34px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--navy);box-shadow:0 6px 0 var(--gold-lo),0 12px 24px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-lo)}
.btn.alt{background:var(--navy2);color:var(--gold-hi);border:2px solid var(--gold);box-shadow:0 6px 0 #0a1120}
.link{color:var(--gold-hi);font-weight:700;font-size:15px}

/* ---------- start ---------- */
.hero{position:relative;width:min(300px,74vw);aspect-ratio:1/1.12;display:flex;align-items:flex-end;justify-content:center;margin-top:4px}
.hero:before{content:"";position:absolute;inset:8% 4% 0;border-radius:50%;background:radial-gradient(circle,rgba(241,213,144,.55),rgba(201,162,74,.15) 55%,transparent 70%)}
.hero .ring{position:absolute;inset:14% 10% 4%;border-radius:50%;border:3px dashed rgba(241,213,144,.35);animation:spin 30s linear infinite}
.hero .homos{position:relative;height:100%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:float 3.2s ease-in-out infinite}
.hero .spark{position:absolute;width:30px;animation:twinkle 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{50%{transform:scale(.6) rotate(20deg);opacity:.5}}
.name-in{font-family:inherit;font-size:19px;font-weight:700;padding:10px 16px;border-radius:16px;border:2px solid rgba(201,162,74,.6);width:min(300px,84vw);text-align:center;background:var(--navy2);color:#fff;outline:none}
.name-in::placeholder{color:var(--muted)}
.name-in:focus{border-color:var(--gold-hi)}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- scene card ---------- */
.scene{position:relative;width:100%;aspect-ratio:400/250;border-radius:24px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.45);background:var(--navy);direction:ltr}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .actor{position:absolute;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.scene .doc{right:1%;bottom:1%;height:96%;animation:float 3.4s ease-in-out infinite}
.scene .patient{left:21%;bottom:31%;width:21%;animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.scene .car{position:absolute;bottom:3%;width:15%;animation:drive 7s linear infinite}
@keyframes drive{from{left:-18%}to{left:110%}}

/* street walker + pain */
.walker{position:absolute;left:50%;bottom:17%;height:74%;transform:translateX(-50%)}
.walker .wrap{position:relative;height:100%;animation:limp 1.2s ease-in-out infinite;transform-origin:50% 100%}
.walker img.me{height:100%;display:block;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
@keyframes limp{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.cheek{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(229,98,94,.75),rgba(229,98,94,0) 70%);top:21%;left:62%;animation:throb .9s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.25);opacity:.65}}
.fx{position:absolute;width:20%;animation:zap .8s ease-in-out infinite}
@keyframes zap{50%{transform:scale(1.3) rotate(12deg);opacity:.55}}
.ouch{position:absolute;top:5%;left:4%;background:var(--cream);color:var(--bad-lo);font-family:var(--f-display);font-weight:800;padding:4px 12px;border-radius:14px;font-size:clamp(14px,4vw,18px);border:2px solid var(--bad);animation:wob .6s ease-in-out infinite alternate;max-width:56%;line-height:1.3}
html[dir="rtl"] .ouch{direction:rtl}
@keyframes wob{to{transform:rotate(-4deg) scale(1.05)}}
.walker.scream .wrap{animation:shake .1s linear infinite}
.walker.scream img.me{filter:drop-shadow(0 0 14px rgba(229,98,94,.9)) sepia(.35) saturate(2.2) hue-rotate(-25deg)}
.walker.happy .wrap{animation:hop .7s ease-in-out infinite}
.walker.happy .cheek,.walker.happy .fx{display:none}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-5px,2px) rotate(-3deg)}50%{transform:translate(4px,-2px) rotate(3deg)}75%{transform:translate(-3px,-1px) rotate(-2deg)}}
.scene>svg.burst{inset:auto;top:4%;right:2%;width:30%;height:auto;display:none;z-index:3}
.scene>svg.burst.on{display:block;animation:burstIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes burstIn{from{transform:scale(0) rotate(-30deg)}}

/* walk to clinic */
.mover{position:absolute;bottom:16%;height:62%;left:2%;animation:walkIn 3.2s ease-in-out forwards}
.mover img{height:100%;animation:hop .45s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
@keyframes walkIn{70%{left:52%;transform:scale(1);opacity:1}100%{left:66%;transform:scale(.55);opacity:0}}

/* ---------- speech bubble ---------- */
.bubble{position:relative;background:var(--cream);color:var(--ink);border-radius:20px;padding:12px 16px;font-size:18px;font-weight:700;line-height:1.5;width:100%;text-align:start;box-shadow:0 6px 0 var(--cream2)}
.bubble:before{content:"";position:absolute;top:-12px;right:18%;border:12px solid transparent;border-bottom:14px solid var(--cream);border-top:0}
.bubble .who{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--gold-lo);font-size:15px;margin-bottom:2px}
.bubble .who img{width:26px}
.ask{display:flex;align-items:center;gap:8px;justify-content:center}
.speak{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--navy2);border:2px solid var(--gold);display:grid;place-items:center;font-size:16px}

/* ---------- answer cards ---------- */
.choices{display:grid;gap:12px;width:100%}
.choices.two{grid-template-columns:1fr 1fr}
.choice{
  background:var(--cream);color:var(--ink);border-radius:20px;padding:10px 14px;font-size:18px;font-weight:800;line-height:1.35;
  box-shadow:0 6px 0 var(--cream2),0 10px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;text-align:start;
  border:3px solid transparent;min-height:68px;transition:transform .1s,background .2s
}
.choice img{width:44px;height:44px;flex-shrink:0}
.choice span{min-width:0}
.choices.two .choice{flex-direction:column;text-align:center;padding:16px 10px 14px;gap:8px;font-size:19px}
.choices.two .choice img{width:72px;height:72px}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cream2)}
.choice.right{background:#dcf7ea;border-color:var(--good);box-shadow:0 6px 0 var(--good-lo)}
.choice.wrong{background:#fde3e2;border-color:var(--bad);box-shadow:0 6px 0 var(--bad-lo);animation:no .4s;opacity:.75}
.choice:disabled{cursor:default}
@keyframes no{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- mini games ---------- */
.game-hud{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--gold-hi)}
.game-hud img{width:30px}
.germ{position:absolute;width:9.5%;transform:translate(-50%,-50%);cursor:pointer;background:none;padding:0;animation:wiggle 1s ease-in-out infinite}
.germ img{width:100%;display:block;pointer-events:none}
.germ.pop{animation:pop .4s forwards;pointer-events:none}
@keyframes wiggle{50%{transform:translate(-50%,-50%) rotate(14deg) scale(1.08)}}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.sparkle{position:absolute;width:12%;transform:translate(-50%,-50%);pointer-events:none;animation:pop .6s forwards}
#scrubCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:none}
.brush{position:absolute;width:18%;pointer-events:none;transform:translate(-30%,-70%) rotate(-30deg);display:none}
.meter{width:100%;height:16px;border-radius:999px;background:var(--navy2);border:2px solid var(--gold);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .2s}

/* ortho animation */
.tooth{transform-box:fill-box;transform-origin:50% 50%;transition:transform 1.3s cubic-bezier(.3,1.4,.5,1)}
.straight .tooth{transform:none!important}
.bracket{opacity:0;transition:opacity .35s}
.fixing .bracket{opacity:1}
.wire{stroke-dasharray:260;stroke-dashoffset:260;transition:stroke-dashoffset .9s ease .6s}
.fixing .wire{stroke-dashoffset:0}

/* ---------- popup ---------- */
.fb{position:fixed;inset:0;background:rgba(6,10,20,.72);display:none;align-items:center;justify-content:center;z-index:30;padding:16px;padding-top:90px}
.fb.on{display:flex;animation:enter .3s ease}
.fb-card{background:var(--cream);color:var(--ink);border-radius:28px;padding:0 20px 22px;max-width:420px;width:100%;text-align:center;border:4px solid var(--gold);box-shadow:0 24px 50px rgba(0,0,0,.5);position:relative}
.fb-homos{height:150px;margin:-112px auto 0;display:block;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}
.fb-homos.scream{animation:shake .1s linear infinite;filter:drop-shadow(0 0 14px rgba(229,98,94,.9)) sepia(.35) saturate(2.2) hue-rotate(-25deg)}
.fb-badge{position:absolute;top:10px;inset-inline-start:14px;width:54px}
.fb-card h3{font-family:var(--f-display);font-size:30px;margin:4px 0 2px;color:var(--navy)}
.fb-card p{font-size:18px;margin:6px 0 14px;font-weight:700;color:#3b4766;line-height:1.55}
.stars{display:flex;justify-content:center;gap:4px;min-height:38px}
.stars img{width:36px;animation:starIn .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}}

/* ---------- certificate ---------- */
.cert{position:relative;width:100%;background:linear-gradient(180deg,var(--navy2),var(--navy));border:3px solid var(--gold);outline:2px solid var(--gold-lo);outline-offset:-10px;border-radius:24px;padding:22px 18px 18px;margin-top:70px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.cert .homos{height:170px;margin:-120px auto 4px;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.cert .medal{position:absolute;top:14px;inset-inline-end:16px;width:58px;animation:bob 2s ease-in-out infinite}
.cert .lbl{font-size:13px;letter-spacing:.14em;color:var(--gold);font-weight:800;text-transform:uppercase}
.cert .kid{font-family:var(--f-display);font-size:clamp(30px,9vw,42px);color:var(--gold-hi);margin:2px 0}
.cert p{margin:4px 0 10px;font-weight:700;color:#e8ecf5;font-size:17px;line-height:1.5}
.cert .score{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:26px;color:var(--gold-hi);font-weight:800;font-variant-numeric:tabular-nums}
.cert .score img{width:30px}
.cert .sign{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid rgba(201,162,74,.4);margin-top:12px;padding-top:10px;font-size:13px;color:var(--muted);text-align:start}
.cert .sign img{height:34px;border-radius:6px}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.foot{font-size:12px;color:#7d88a3;margin-top:auto;padding-top:16px;text-align:center;line-height:1.6}
.foot a{color:#9aa6c2}

@media (max-width:380px){
  .choice{font-size:16px;min-height:60px}
  .choice img{width:38px;height:38px}
  .bubble{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app">
  <div class="top">
    <img class="logo" src="../logo.png" alt="Hyatt Elite" />
    <div class="sp"></div>
    <div class="pill" id="starPill"><img src="tw/2b50.svg" alt="" /><b id="starCount">0</b></div>
    <button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button>
    <button class="icon-btn" id="langBtn" aria-label="Language">EN</button>
  </div>
  <div class="progress" id="progress"></div>

  <!-- START -->
  <section class="screen on" id="s-start">
    <h1 data-t="title"></h1>
    <p class="sub" data-t="subtitle"></p>
    <div class="hero">
      <div class="ring"></div>
      <img class="spark" src="tw/2728.svg" alt="" style="top:8%;left:6%" />
      <img class="spark" src="tw/2728.svg" alt="" style="top:22%;right:2%;animation-delay:.7s;width:24px" />
      <img class="spark" src="tw/1f9b7.svg" alt="" style="bottom:18%;left:0;width:40px;animation-delay:1.2s" />
      <img class="homos" src="homos-cut.webp" alt="Dr. Homos" />
    </div>
    <div class="meta-row"><span class="tag" id="lvlCountTag"></span><span class="tag" data-t="ageTag"></span></div>
    <input class="name-in" id="kidName" maxlength="20" autocomplete="off" />
    <button class="btn" id="playBtn" data-t="play"></button>
  </section>

  <!-- LEVEL 1: STREET -->
  <section class="screen" id="s-street">
    <span class="tag" data-t="lvl1tag"></span>
    <div class="scene" id="streetScene">
      <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" id="streetSvg" aria-hidden="true"></svg>
      <img class="car" src="tw/1f68c.svg" alt="" />
      <div class="ouch" data-t="ouch"></div>
      <div class="walker" id="walker">
        <div class="wrap">
          <img class="me" src="homos-cut.webp" alt="Dr. Homos" />
          <div class="cheek"></div>
          <img class="fx" src="tw/1f4a2.svg" alt="" style="top:2%;left:66%" />
          <img class="fx" src="tw/26a1.svg" alt="" style="top:22%;left:84%;animation-delay:.3s" />
          <img class="fx" src="tw/1f4a6.svg" alt="" style="top:4%;left:8%;width:16%;animation-delay:.5s" />
        </div>
      </div>
      <svg class="burst" id="burst" viewBox="0 0 120 90" aria-hidden="true"><path d="M60 2 72 22 96 8 92 32 118 34 98 50 114 72 88 66 82 88 64 70 44 88 40 64 12 74 24 52 2 40 28 30 18 8 44 20Z" fill="#e5625e" stroke="#fbf6ea" stroke-width="4"/><text x="60" y="54" text-anchor="middle" font-family="Baloo Bhaijaan 2,Cairo,sans-serif" font-size="22" font-weight="800" fill="#fbf6ea" id="burstTxt">آآآه!</text></svg>
    </div>
    <div class="ask"><h2 data-t="q1"></h2><button class="speak" data-speak="q1" aria-label="Read aloud">🔈</button></div>
    <div class="choices two">
      <button class="choice" id="goHome"><img src="tw/1f3e0.svg" alt="" /><span data-t="home"></span></button>
      <button class="choice" id="goDentist"><img src="tw/1f9b7.svg" alt="" /><span data-t="dentist"></span></button>
    </div>
  </section>

  <!-- WALK TO CLINIC -->
  <section class="screen" id="s-walk">
    <span class="tag" data-t="walkTag"></span>
    <div class="scene">
      <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" id="walkSvg" aria-hidden="true"></svg>
      <div class="mover" id="mover"><img src="homos-cut.webp" alt="" /></div>
    </div>
    <div class="bubble"><div class="who"><img src="tw/1f9b7.svg" alt="" /><span data-t="docName"></span></div><span id="walkBubble"></span></div>
  </section>

  <!-- CLINIC LEVELS -->
  <section class="screen" id="s-level">
    <span class="tag" id="lvTag"></span>
    <div class="scene" id="lvScene"></div>
    <div class="bubble" id="lvBubble"><div class="who"><img id="lvWhoImg" src="tw/1f430.svg" alt="" /><span id="lvWho"></span></div><span id="lvText"></span></div>
    <div class="ask"><h2 id="lvAsk"></h2><button class="speak" id="lvSpeak" aria-label="Read aloud">🔈</button></div>
    <div id="lvBody" style="width:100%"></div>
  </section>

  <!-- END -->
  <section class="screen" id="s-end">
    <h1 data-t="endTitle"></h1>
    <div class="cert">
      <img class="medal" src="tw/1f3c5.svg" alt="" />
      <img class="homos" src="homos-cut.webp" alt="" />

var ac = null;
function ctx(){ if (!ac) { try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === "suspended") ac.resume(); return ac; }
function tone(f, d, type, when, vol, slideTo){
  var a = ctx(); if (!a || !sound) return;
  var o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + (when||0);
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t0);

  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol||0.2, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + 0.05);
}

function sScream(){
  var a = ctx(); if (!a || !sound) return;
  var o = a.createOscillator(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain(), t0 = a.currentTime;
  o.type = "sawtooth"; o.frequency.setValueAtTime(900, t0); o.frequency.exponentialRampToValueAtTime(260, t0 + 1.3);
  lfo.frequency.value = 18; lg.gain.value = 40; lfo.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
  o.connect(g).connect(a.destination); o.start(t0); lfo.start(t0); o.stop(t0 + 1.5); lfo.stop(t0 + 1.5);
}
function speak(text){

/* =========================================================
   CONFETTI (gold / navy / cream to match the brand)
   ========================================================= */
var cv = $("confetti"), cx = cv.getContext("2d"), parts = [], raf = null;
function fit(){ cv.width = innerWidth; cv.height = innerHeight; } fit(); addEventListener("resize", fit);
function confetti(n){
  var cols = [GOLD, GOLDHI, "#ffffff", "#3fbf8a", "#8fb3ff", "#e8c770"];
  for (var i = 0; i < (n||140); i++){
    parts.push({ x: innerWidth/2 + (Math.random()-.5)*160, y: innerHeight*0.42, vx:(Math.random()-.5)*15, vy: -Math.random()*14-4,
      r: Math.random()*7+4, c: cols[i%cols.length], a: Math.random()*6, va:(Math.random()-.5)*.3, round: Math.random()<.3 });
  }
  if (!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(function(p){
    p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle = p.c;
    if (p.round){ cx.beginPath(); cx.arc(0,0,p.r/2.4,0,6.3); cx.fill(); } else cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
    cx.restore();
  });
  parts = parts.filter(function(p){ return p.y < cv.height + 40; });
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

  var last = idx === LEVELS.length - 1, titles = t("okT");
  setTimeout(function(){
    popup({ title: titles[idx % titles.length], text: L[lang].f, stars: earned, badge: L.pe, say:true,
      btn: last ? t("finish") : t("next"),
      next: function(){ if (last) finish(); else { idx++; openLevel(); } } });
  }, 550);
}

/* ---------- mini game: tap the germs ---------- */
var germsLeft = 0;
function updateGermHud(){ var h = $("germHud"); if (h) h.lastChild.textContent = germsLeft + " " + t("germsLeft"); }
function buildGerms(L, sc, body){
  sc.innerHTML = '<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + mouthSVG({}) + '</svg>' +
    '<img class="actor" src="' + tw(L.pe) + '" alt="" style="left:3%;top:4%;width:16%" />';
  var spots = UP.map(function(t){ return [t.x + t.w/2, t.y + t.h*0.62]; }).concat(LOW.map(function(t){ return [t.x + t.w/2, t.y + t.h*0.45]; }));
  spots.sort(function(){ return Math.random() - .5; });
  spots = spots.slice(0, 8); germsLeft = spots.length;
  spots.forEach(function(p, i){
    var g = document.createElement("button"); g.className = "germ"; g.setAttribute("aria-label", "germ");
    g.style.left = (p[0]/4) + "%"; g.style.top = (p[1]/2.5) + "%"; g.style.animationDelay = (i*0.13) + "s";
    g.innerHTML = '<img alt="" src="' + tw("1f9a0") + '" />';
    g.onclick = function(){
      if (g.classList.contains("pop")) return;
      g.classList.add("pop"); sPop(); germsLeft--; updateGermHud();
      var sp = document.createElement("img"); sp.className = "sparkle"; sp.src = tw("2728"); sp.alt = "";
      sp.style.left = g.style.left; sp.style.top = g.style.top; sc.appendChild(sp);
      setTimeout(function(){ g.remove(); sp.remove(); }, 600);
      if (germsLeft === 0) setTimeout(function(){ win(L, 3); }, 500);
    };
    sc.appendChild(g);
  });
  body.innerHTML = '<div class="game-hud" id="germHud"><img src="' + tw("1f9a0") + '" alt="" /><span></span></div>';
}

/* ---------- mini game: scrub the plaque ---------- */
function buildScrub(L, sc, body){
  sc.innerHTML = '<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + mouthSVG({}) + '</svg>' +
    '<img class="actor" src="' + tw(L.pe) + '" alt="" style="left:3%;top:4%;width:16%" />' +
    '<canvas id="scrubCanvas"></canvas><img class="brush" id="brush" src="' + tw("1faa5") + '" alt="" />';
  body.innerHTML = '<div class="game-hud"><img src="' + tw("1faa5") + '" alt="" /><span>' + t("cleanLeft") + '</span></div><div class="meter"><i id="scrubMeter"></i></div>';
  var c = $("scrubCanvas"), g = c.getContext("2d"), brush = $("brush");
  var W, H, sx, total = 0, done = false, moves = 0;
  function setup(){
    var r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    W = c.width = Math.round(r.width * dpr); H = c.height = Math.round(r.height * dpr); sx = W / 400;
    g.globalCompositeOperation = "source-over";
    UP.concat(LOW).forEach(function(t){
      g.fillStyle = "rgba(214,186,72,.92)";
      g.beginPath(); g.roundRect ? g.roundRect((t.x+1)*sx, (t.y+(t.h>40?16:2))*sx, (t.w-2)*sx, (t.h-(t.h>40?18:12))*sx, 6*sx) : g.rect((t.x+1)*sx,(t.y+16)*sx,(t.w-2)*sx,(t.h-18)*sx); g.fill();
      g.fillStyle = "rgba(170,140,40,.9)";
      for (var k = 0; k < 3; k++){ g.beginPath(); g.arc((t.x + 6 + Math.random()*(t.w-12))*sx, (t.y + 20 + Math.random()*(t.h-26))*sx, (2+Math.random()*3)*sx, 0, 6.3); g.fill(); }
    });
    total = count();
  }
  function count(){
    var d = g.getImageData(0,0,W,H).data, n = 0;
    for (var i = 3; i < d.length; i += 4*16) if (d[i] > 30) n++;
    return n;
  }
  function pos(e){ var r = c.getBoundingClientRect(); return [(e.clientX - r.left), (e.clientY - r.top), r]; }
  var down = false, last = null;
  function scrub(e){
    var p = pos(e), r = p[2];
    brush.style.display = "block"; brush.style.left = (p[0]/r.width*100) + "%"; brush.style.top = (p[1]/r.height*100) + "%";
    if (!down || done) return;
    var x = p[0] * W / r.width, y = p[1] * H / r.height;
    g.globalCompositeOperation = "destination-out"; g.lineCap = "round"; g.lineWidth = 34 * sx;
    g.beginPath(); g.moveTo(last ? last[0] : x, last ? last[1] : y); g.lineTo(x, y); g.stroke();
    last = [x, y];
    if (++moves % 6 === 0){
      sScrub();
      var left = count(), pct = Math.min(100, Math.round((1 - left/total) * 100 / 0.9));
      $("scrubMeter").style.width = pct + "%";
      if (pct >= 100){ done = true; g.clearRect(0,0,W,H); brush.style.display = "none"; sBling(); setTimeout(function(){ win(L, 3); }, 500); }
    }
  }
  c.addEventListener("pointerdown", function(e){ down = true; last = null; try { c.setPointerCapture(e.pointerId); } catch(_){} scrub(e); });
  c.addEventListener("pointermove", scrub);
  c.addEventListener("pointerup", function(){ down = false; last = null; });
  c.addEventListener("pointerleave", function(){ down = false; last = null; brush.style.display = "none"; });
  requestAnimationFrame(setup);
}

/* =========================================================
   END
   ========================================================= */
function finish(){
  showScreen("s-end"); renderProgress(TOTAL);
  $("certStars").textContent = stars + " / " + (TOTAL * 3);
  $("certName").textContent = kid || t("friend");
  sCheer(); confetti(260); setTimeout(function(){ confetti(160); }, 700);
  speak(t("endTitle"));
}
$("againBtn").onclick = function(){ sClick(); hush(); showScreen("s-start"); renderProgress(-1); stars = 0; $("starCount").textContent = "0"; };

document.addEventListener("click", function(e){ var s = e.target.closest("[data-speak]"); if (s) speak(t(s.getAttribute("data-speak"))); });
$("lvSpeak").onclick = function(){ var d = LEVELS[idx][lang]; speak(d.s + " " + d.q); };
$("soundBtn").onclick = function(){ sound = !sound; this.textContent = sound ? "🔊" : "🔇"; if (!sound) hush(); else sClick(); };
$("langBtn").onclick = function(){
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("homos_lang", lang); } catch(e){}
  applyLang(); sClick();
};

applyLang();
})();
